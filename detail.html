<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="jouw naam">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Munchkin Box 8 - Dunkin'</title>

    <link href="styles/style.css" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <a href="index.html" class="logo">
            <img src="images/dunkin-logo.png" alt="Dunkin' homepage">
        </a>
    </header>

    <main>

        <a href="index.html">← Terug</a>

        <section class="product-header">
            <img src="images/munchkin-box-8.png" alt="Munchkin Box 8">
            <h1>Munchkin Box 8</h1>
            <p>Geniet van heerlijke Munchkins uit ons assortiment en stel zelf je Munchkins box 8 samen</p>
            <p>vanaf € 5,95</p>
        </section>

        <section class="product-picker">
            <h2>Selecteer je 8 munchkins</h2>

            <div class="munchkin-item">
                <img src="images/boston-munchkin.png" alt="Boston Munchkin">
                <h3>Boston Munchkin</h3>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>

            <div class="munchkin-item">
                <img src="images/white-chocolate-oreo-munchkin.png" alt="White Chocolate Oreo Munchkin">
                <h3>White Chocolate Oreo Munchkin</h3>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>

            <div class="munchkin-item">
                <img src="images/red-velvet-munchkin.png" alt="Red Velvet Munchkin">
                <h3>Red Velvet Munchkin</h3>
                <button>-</button>
                <span>0</span>
                <button>+</button>
            </div>

        </section>

    </main>

    <!-- TODO: toegankelijkheid nog verbeteren (aria-labels, skip-link, semantische stepper-groep, etc.) -->
    <!-- TODO: afreken-balk onderaan nog toevoegen -->

</body>

</html>
